name: Verify Resume Screener

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_artifacts.py
      - run: python -m py_compile app.py scripts/verify_artifacts.py scripts/train_stage1.py scripts/train_stage2.py scripts/record_run.py
